# .github/workflows/api-gateway-rollback.yml
name: Rollback API Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      previous_tag:
        description: 'Previous image tag to rollback to'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get current ASG info
        id: asg_info
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(Tags[?Key=='Name'].Value, 'api-gateway-${{ github.event.inputs.environment }}')].AutoScalingGroupName" \
            --output text)
          
          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT
      
      - name: Update launch template with previous image
        run: |
          # Get current launch template
          LT_ID=$(aws ec2 describe-launch-templates \
            --query "LaunchTemplates[?contains(LaunchTemplateName, 'api-gateway-${{ github.event.inputs.environment }}')].LaunchTemplateId" \
            --output text)
          
          # Create new version with previous image
          aws ec2 create-launch-template-version \
            --launch-template-id $LT_ID \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"ami-xxxx\",\"UserData\":\"$(base64 -w0 <<< 'IMAGE_TAG=${{ github.event.inputs.previous_tag }}')\"}"
      
      - name: Start instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ steps.asg_info.outputs.asg_name }} \
            --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 300}'