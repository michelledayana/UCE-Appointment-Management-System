services:
  authentication-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: dayanaheredia/user-authentication-service:latest
    container_name: authentication_service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - microservices-net
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8082

networks:
  microservices-net:
    external: true
    name: microservices-net
