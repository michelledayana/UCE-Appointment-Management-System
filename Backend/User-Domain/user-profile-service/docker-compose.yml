services:
  user-profile-service:
    image: dayanaheredia/user-profile-service:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user-profile-service
    env_file:
      - .env
    ports:
      - "8083:8083"
    depends_on:
      - db-profile     # ✅ SOLO la BD (sí está en este compose)
    networks:
      - user-network

  db-profile:
    image: postgres:15-alpine
    container_name: db-profile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5436:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data
    networks:
      - user-network

volumes:
  profile_db_data:

networks:
  user-network:
    external: true
