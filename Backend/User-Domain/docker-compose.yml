services:

  user-registration-service:
    image: user-registration-service:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user-registration-service
    environment:
      APP_NAME: user-registration-service
      APP_PORT: 8081

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db-registration:5432/users_db

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NAME: user_registered_topic

    ports:
      - "8081:8081"
    networks:
      - user-network

networks:
  user-network:
    external: true
    name: user-network
