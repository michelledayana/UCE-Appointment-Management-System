version: "3.8"

services:
  # Base de Datos Ligera (Alpine)
  db-registration:
    image: postgres:15-alpine
    container_name: db_registration
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - microservices-net
    volumes:
      - registration_data:/var/lib/postgresql/data

  # Infraestructura de Mensajería (Kafka Lite)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-net

  # Microservicio de Registro (Optimizado)
  user-registration-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user_registration_service
    image: dayanaheredia/user-registration-service:latest
    depends_on:
      - db-registration
      - kafka
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db-registration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONUNBUFFERED=1
    ports:
      - "8081:8081"
    networks:
      - microservices-net

# Configuración de Red Única
networks:
  microservices-net:
    name: microservices-net
    driver: bridge

# Persistencia de Datos
volumes:
  registration_data: