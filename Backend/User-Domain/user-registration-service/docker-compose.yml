version: "3.9"

services:
  user-registration-service:
    image: dayanaheredia/user-registration-service:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: user-registration-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - user-network

networks:
  user-network:
    external: true
    name: user-network
