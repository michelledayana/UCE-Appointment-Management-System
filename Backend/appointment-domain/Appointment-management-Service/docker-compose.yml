version: "3.9"

services:
  appointment-management-service:
    container_name: appointment-management-service
    image: dayanaheredia/appointment-management-service:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8088:8088"
    networks:
      - user-network
    restart: unless-stopped

networks:
  user-network:
    external: true
